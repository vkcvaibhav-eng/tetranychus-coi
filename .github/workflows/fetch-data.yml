name: Fetch sequences and occurrence data

on:
  workflow_dispatch:
    inputs:
      source:
        description: "What to download"
        type: choice
        options: [all, ncbi, bold, gbif, climate-only]
        default: all
      ncbi_query:
        description: "NCBI Nucleotide query"
        required: true
        default: 'Tetranychus urticae[Organism] AND (COI[Gene] OR COX1[Gene] OR "cytochrome oxidase subunit I" OR "cytochrome c oxidase subunit I")'
      taxon:
        description: "Taxon for BOLD and GBIF (species or genus name)"
        required: true
        default: "Tetranychus urticae"
      name:
        description: "Output file name (no extension)"
        required: true
        default: "tetranychus_urticae"
      ncbi_out_dir:
        description: "Folder for NCBI files (use data/its2 for ITS2 or other non-COI markers)"
        required: true
        default: "data"
      climate_resolution:
        description: "WorldClim resolution"
        type: choice
        options: [10m, 5m, 2.5m]
        default: 10m

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt
          mkdir -p data/logs

      - name: Download from NCBI
        id: ncbi
        if: ${{ contains(fromJSON('["all","ncbi"]'), github.event.inputs.source) }}
        continue-on-error: true
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          QUERY: ${{ inputs.ncbi_query }}
          NAME: ${{ inputs.name }}
          OUT_DIR: ${{ inputs.ncbi_out_dir }}
        run: |
          set -o pipefail
          python scripts/fetch_ncbi.py "$QUERY" "ncbi_$NAME" "$OUT_DIR" 2>&1 | tee data/logs/ncbi.log

      - name: Download from BOLD
        id: bold
        if: ${{ contains(fromJSON('["all","bold"]'), github.event.inputs.source) }}
        continue-on-error: true
        env:
          TAXON: ${{ inputs.taxon }}
          NAME: ${{ inputs.name }}
        run: |
          set -o pipefail
          python scripts/fetch_bold.py "$TAXON" "bold_$NAME" 2>&1 | tee data/logs/bold.log

      - name: Download from GBIF
        id: gbif
        if: ${{ contains(fromJSON('["all","gbif"]'), github.event.inputs.source) }}
        continue-on-error: true
        env:
          TAXON: ${{ inputs.taxon }}
          NAME: ${{ inputs.name }}
        run: |
          set -o pipefail
          python scripts/fetch_gbif.py "$TAXON" "gbif_$NAME" 2>&1 | tee data/logs/gbif.log

      - name: Extract WorldClim climate at all record locations
        id: climate
        continue-on-error: true
        env:
          RES: ${{ inputs.climate_resolution }}
        run: |
          set -o pipefail
          python scripts/climate_extract.py "$RES" 2>&1 | tee data/logs/climate.log

      - name: Save files and logs to the repository
        if: always()
        run: |
          {
            echo "Run: ${{ github.run_id }} ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            echo "NCBI: ${{ steps.ncbi.outcome }}"
            echo "BOLD: ${{ steps.bold.outcome }}"
            echo "GBIF: ${{ steps.gbif.outcome }}"
            echo "Climate: ${{ steps.climate.outcome }}"
          } > data/logs/last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Data download: ${{ github.event.inputs.name }} (${{ github.event.inputs.source }})" || echo "Nothing new to commit"
          git push

      - name: Report failures
        if: ${{ steps.ncbi.outcome == 'failure' || steps.bold.outcome == 'failure' || steps.gbif.outcome == 'failure' || steps.climate.outcome == 'failure' }}
        run: |
          cat data/logs/last_run.txt
          echo "One or more steps failed; see data/logs/ in the repository."
          exit 1
