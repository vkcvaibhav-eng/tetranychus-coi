name: Run analysis

on:
  workflow_dispatch:
    inputs:
      reference_accession:
        description: "Reference mitochondrial genome (NCBI accession)"
        required: true
        default: "NC_010526"
      reference_organism:
        description: "Expected organism of the reference"
        required: true
        default: "Tetranychus urticae"
      focal_species:
        description: "Species for the focused audit"
        required: true
        default: "Tetranychus urticae"
      min_identity:
        description: "Minimum identity to the reference (0.75 suits the whole genus)"
        required: true
        default: "0.75"
      cluster_threshold:
        description: "K2P distance for species clusters"
        required: true
        default: "0.03"

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      REF_ACC: ${{ inputs.reference_accession }}
      REF_ORG: ${{ inputs.reference_organism }}
      FOCAL: ${{ inputs.focal_species }}
      MIN_ID: ${{ inputs.min_identity }}
      THRESHOLD: ${{ inputs.cluster_threshold }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt
          rm -f results/*.csv results/*.fasta results/*.txt
          mkdir -p results/logs

      - name: Fetch reference COX1
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          set -o pipefail
          python scripts/fetch_reference.py "$REF_ACC" "$REF_ORG" 2>&1 | tee results/logs/reference.log

      - name: Focal species audit (merge and quality check)
        run: |
          set -o pipefail
          python scripts/merge_records.py data results/urticae --species "$FOCAL" 2>&1 | tee results/logs/urticae_merge.log
          python scripts/sequence_qc.py --results results/urticae --min-identity "$MIN_ID" 2>&1 | tee results/logs/urticae_qc.log

      - name: Whole genus (merge and quality check)
        run: |
          set -o pipefail
          python scripts/merge_records.py data results/genus 2>&1 | tee results/logs/genus_merge.log
          python scripts/sequence_qc.py --results results/genus --min-identity "$MIN_ID" 2>&1 | tee results/logs/genus_qc.log

      - name: Species-level analysis
        run: |
          set -o pipefail
          python scripts/species_analysis.py --results results/genus --out results/species --threshold "$THRESHOLD" 2>&1 | tee results/logs/species.log

      - name: Anchor check
        run: |
          set -o pipefail
          python scripts/anchor_check.py 2>&1 | tee results/logs/anchors.log

      - name: Identification accuracy (raw vs cleaned database)
        run: |
          set -o pipefail
          python scripts/identification_test.py 2>&1 | tee results/logs/identification.log

      - name: Trends by submission year and country
        run: |
          set -o pipefail
          python scripts/trends.py 2>&1 | tee results/logs/trends.log

      - name: ITS2 check (when ITS2 data are present)
        run: |
          set -o pipefail
          if ls data/its2/*.gb >/dev/null 2>&1; then
            python scripts/its2_analysis.py 2>&1 | tee results/logs/its2.log
          else
            echo "No ITS2 data in data/its2; skipped" | tee results/logs/its2.log
          fi

      - name: Save results to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data results
          git commit -m "Analysis results (reference $REF_ACC, focal $FOCAL)" || echo "Nothing new to commit"
          git pull --rebase -q
          git push
